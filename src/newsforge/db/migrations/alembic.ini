# NewsForge Alembic configuration (PRODUCTION_READINESS_DATABASE).
# The migrations directory ships INSIDE the package (src/newsforge/db/migrations)
# so a bare copy of `src` — as used by the Docker image — can bootstrap the schema.
# The database URL is resolved at runtime by env.py (NEWSFORGE_DATABASE_URL /
# NEWSFORGE_DB_PATH / the default SQLite path); it is never committed here.
[alembic]
script_location = src/newsforge/db/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is injected by env.py from DatabaseConfig when not provided.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers =
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S