{% extends "base.html" %}
{% block title %}Articles — {{ brand }}{% endblock %}
{% block content %}
<h1>Published articles</h1>
{% if entries %}
<ul class="article-list">
  {% for e in entries %}
  <li><a href="/articles/{{ e.slug }}">{{ e.title }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>No published articles yet.</p>
{% endif %}
{% endblock %}
