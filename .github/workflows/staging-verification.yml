name: NewsForge Staging Verification
on: [push, pull_request]

env:
  DOCKER_IMAGE: newsforge-mvp
  DOCKER_TAG: ${{ github.sha }}
  PYTHON_VERSION: '3.12'
  TZ: UTC
  LANG: C.UTF-8
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

concurrency:
  group: newsforge-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        
      - name: Build NewsForge staging image
        run: |
          echo "Building NewsForge staging image..."
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          # Deterministic build metadata: GIT_COMMIT and BUILD_TIME are derived
          # from the source commit, so the image reports exactly which source
          # produced it. On PR events head_commit.timestamp is empty and the
          # Dockerfile ARG default ("unknown") kicks in.
          docker build \
            --tag "${IMAGE_REF}" \
            --label "version=${{ github.sha }}" \
            --build-arg "GIT_COMMIT=${{ github.sha }}" \
            --build-arg "VERSION=0.1.0" \
            --build-arg "BUILD_TIME=${{ github.event.head_commit.timestamp }}" \
            .
          echo "Build complete"
        
      - name: Run health check in container
        id: health_check
        run: |
          echo "Starting container for health check..."
          HEALTH_CONTAINER="newsforge-health-test-$(date +%s)"
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          docker run -d --name "${HEALTH_CONTAINER}" \
            -p 8080:8000 \
            -e NEWSFORGE_DB_PATH=/data/newsforge.db \
            -e NEWSFORGE_MOCK_AI=true \
            -e NEWSFORGE_ADMIN_TOKEN=ci-admin-token \
            "${IMAGE_REF}" || exit 1
          
          echo "Waiting for service to become available..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              HEALTH=$(curl -s http://localhost:8080/health 2>/dev/null || echo "")
              # Validate JSON and status/db fields
              if echo "$HEALTH" | grep -q '"status":"ok"' && \
                 echo "$HEALTH" | grep -q '"db":"connected"'; then
                echo "Health check passed!"
                echo "HEALTH_STATUS=success" >> $GITHUB_OUTPUT
                break
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/30, HTTP: ${HTTP_CODE}, waiting..."
            sleep 2
          done
          
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Health check failed after max attempts"
            echo "=== DIAGNOSTIC: container state ==="
            docker ps -a --filter "name=${HEALTH_CONTAINER}" 2>&1 || true
            docker inspect "${HEALTH_CONTAINER}" --format '{{.State.Status}} {{.State.ExitCode}}' 2>&1 || true
            echo "=== DIAGNOSTIC: container logs ==="
            docker logs "${HEALTH_CONTAINER}" 2>&1 || true
            echo "=== DIAGNOSTIC: /data existence ==="
            docker exec "${HEALTH_CONTAINER}" sh -c 'ls -ld /data && ls -la /data' 2>&1 || true
            echo "=== DIAGNOSTIC: last HTTP response ==="
            curl -i http://localhost:8080/health 2>&1 || true
            exit 1
          fi
        
      - name: Run smoke tests on endpoints
        id: smoke_tests
        run: |
          echo "Running endpoint smoke tests..."
          SMOKE_CONTAINER="newsforge-smoke-test-$(date +%s)"
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          docker run -d --name "${SMOKE_CONTAINER}" \
            -p 8090:8000 \
            -e NEWSFORGE_DB_PATH=/data/newsforge.db \
            -e NEWSFORGE_MOCK_AI=true \
            -e NEWSFORGE_ADMIN_TOKEN=ci-admin-token \
            "${IMAGE_REF}" || exit 1
          
          echo "Waiting for smoke test service to become available..."
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HEALTH=$(curl -s http://localhost:8090/health 2>/dev/null || echo "")
            if echo "$HEALTH" | grep -q '"status":"ok"'; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 2
          done
          
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Smoke test service failed to start"
            exit 1
          fi
          
          # Run smoke tests against the running container using curl directly
          echo "Testing endpoints..."
          ALL_PASSED=true

          for endpoint in /health /articles /sitemap.xml /feed.xml; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090${endpoint} 2>/dev/null || echo "000")
            if [ "$STATUS_CODE" = "200" ]; then
              echo "✓ $endpoint: HTTP 200 OK"
            else
              echo "✗ $endpoint: HTTP ${STATUS_CODE}"
              ALL_PASSED=false
            fi
          done

          # Internal BI /analytics is gated: authorized request must be 200, anonymous 403.
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Admin-Token: ci-admin-token" http://localhost:8090/analytics 2>/dev/null || echo "000")
          if [ "$AUTH_STATUS" = "200" ]; then
            echo "✓ /analytics (authorized): HTTP 200 OK"
          else
            echo "✗ /analytics authorized: HTTP ${AUTH_STATUS}"
            ALL_PASSED=false
          fi
          DENY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/analytics 2>/dev/null || echo "000")
          if [ "$DENY_STATUS" = "403" ]; then
            echo "✓ /analytics (unauthorized): denied with 403"
          else
            echo "✗ /analytics unauthorized: HTTP ${DENY_STATUS} (expected 403)"
            ALL_PASSED=false
          fi

          # Ops observability: /live is static 200, /ready mirrors DB health, request
          # correlation header and internal /metrics (admin-gated) behave as specified.
          LIVE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/live 2>/dev/null || echo "000")
          if [ "$LIVE_STATUS" = "200" ]; then
            echo "✓ /live: HTTP 200 OK"
          else
            echo "✗ /live: HTTP ${LIVE_STATUS}"
            ALL_PASSED=false
          fi
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/ready 2>/dev/null || echo "000")
          if [ "$READY_STATUS" = "200" ]; then
            echo "✓ /ready: HTTP 200 OK"
          else
            echo "✗ /ready: HTTP ${READY_STATUS}"
            ALL_PASSED=false
          fi
          REQID=$(curl -s -D - -o /dev/null -H "X-Request-ID: ci-smoke-1" http://localhost:8090/health 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="x-request-id:"{print $2}')
          if [ "$REQID" = "ci-smoke-1" ]; then
            echo "✓ X-Request-ID echoed: ${REQID}"
          else
            echo "✗ X-Request-ID not echoed (got '${REQID}')"
            ALL_PASSED=false
          fi
          METRICS_DENY=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/metrics 2>/dev/null || echo "000")
          if [ "$METRICS_DENY" = "403" ]; then
            echo "✓ /metrics (unauthorized): denied with 403"
          else
            echo "✗ /metrics unauthorized: HTTP ${METRICS_DENY} (expected 403)"
            ALL_PASSED=false
          fi
          METRICS_OK_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Admin-Token: ci-admin-token" http://localhost:8090/metrics 2>/dev/null || echo "000")
          METRICS_OK=$(curl -s -H "X-Admin-Token: ci-admin-token" http://localhost:8090/metrics 2>/dev/null || echo "")
          if [ "$METRICS_OK_CODE" = "200" ]; then
            echo "✓ /metrics (authorized): HTTP 200 OK"
          else
            echo "✗ /metrics authorized: HTTP ${METRICS_OK_CODE}"
            ALL_PASSED=false
          fi
          if echo "$METRICS_OK" | grep -q '"schema_version"'; then
            echo "✓ /metrics exposes build/schema info"
          else
            echo "✗ /metrics missing schema_version in body"
            ALL_PASSED=false
          fi

          # Auto-docs are disabled: /docs, /redoc, /openapi.json must be hidden (404).
          for endpoint in /docs /redoc /openapi.json; do
            DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090${endpoint} 2>/dev/null || echo "000")
            if [ "$DOCS_STATUS" = "404" ]; then
              echo "✓ $endpoint hidden (404)"
            else
              echo "✗ $endpoint exposed: HTTP ${DOCS_STATUS}"
              ALL_PASSED=false
            fi
          done

          if [ "$ALL_PASSED" = true ]; then
            echo "SMOKE_TESTS=passed" >> $GITHUB_OUTPUT
          else
            echo "SMOKE_TESTS=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        
      - name: Verify persistence across restart
        run: |
          echo "Verifying data survives a container restart..."
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          VOLUME="newsforge-persist-vol"

          # Mount the probe script (the image only ships src/); PYTHONPATH=/app/src
          # is baked into the image so `newsforge.*` imports resolve.
          mount_args=(
            --volume "${VOLUME}:/data"
            --volume "$GITHUB_WORKSPACE/scripts:/scripts:ro"
            -e NEWSFORGE_DB_PATH=/data/newsforge.db
            -e NEWSFORGE_MOCK_AI=true
            --entrypoint python
          )

          # First run (fresh named volume): initialize schema and write a probe row.
          docker run --rm "${mount_args[@]}" "${IMAGE_REF}" /scripts/persistence_probe.py write || exit 1

          # Second run (brand-new container, SAME volume): the row must still exist.
          docker run --rm "${mount_args[@]}" "${IMAGE_REF}" /scripts/persistence_probe.py read || exit 1

          echo "Persistence across restart verified (volume ${VOLUME})."

      - name: Run pytest test suite in container
        run: |
          echo "Running full test suite inside container..."
          
          # Build the dedicated "test" image target: runtime + pytest overlay.
          # The runtime image is intentionally free of test dependencies.
          TEST_IMAGE="${{ env.DOCKER_IMAGE }}-test"
          docker build \
            --tag "${TEST_IMAGE}" \
            --target test \
            --build-arg "GIT_COMMIT=${{ github.sha }}" \
            --build-arg "VERSION=0.1.0" \
            . || exit 1

          docker run --rm \
            --name newsforge-test-runner-$(date +%s) \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e NEWSFORGE_MOCK_AI=true \
            -e NEWSFORGE_DB_PATH=/data/newsforge.db \
            -e NEWSFORGE_REPO_ROOT=/repo \
            "${TEST_IMAGE}" \
            python -m pytest /app/tests/test_p4_generation.py /app/tests/test_p5_publish_seo.py /app/tests/test_p6_analytics.py /app/tests/test_reproducibility.py -v --tb=short || exit 1
        
      - name: Run regression tests locally (no Docker)
        run: |
          echo "Running regression tests outside container..."

          # Install the FROZEN runtime + test dependency set (requirements-dev.txt
          # overlays the runtime pins with pytest/httpx2). Failures surface loudly:
          # never silence pip with `|| true` (OPS_HARDENING_REPRODUCIBILITY).
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

          python -m pytest tests/ -q || exit 1
        
      - name: Verify image content safety
        run: |
          echo "Checking container image for secrets..."
          
          # Check for debug/dev commands in CMD
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          CMD_OUTPUT=$(docker inspect "${IMAGE_REF}" --format='{{.Config.Cmd}}')
          if echo "$CMD_OUTPUT" | grep -qiE "(python-debug|pip install.*-e|pip install.*git)"; then
            echo "✗ Debug/dev commands found in CMD"
            exit 1
          else
            echo "✓ No debug/dev commands in CMD"
          fi
          
          # Check recent image layers for secrets
          RECENT_LAYERS=$(docker history "${IMAGE_REF}" --no-trunc 2>/dev/null | head -n 10)
          if echo "$RECENT_LAYERS" | grep -qiE "(secret|key|token|password|credential)"; then
            echo "✗ Potential secrets found in recent image layers"
            exit 1
          else
            echo "✓ No obvious secrets in recent image layers"
          fi

      - name: Verify container runs as non-root
        run: |
          echo "Checking that the web process does NOT run as root..."
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"

          IMAGE_USER=$(docker inspect "${IMAGE_REF}" --format '{{.Config.User}}')
          echo "Configured container user: '${IMAGE_USER}'"
          case "${IMAGE_USER}" in
            ""|root|0|0:0)
              echo "✗ image runs as root"
              exit 1 ;;
            *)
              echo "✓ non-root user configured in image" ;;
          esac

          RUNNER_ID=$(docker run --rm --entrypoint id "${IMAGE_REF}" 2>&1)
          echo "Runtime identity: ${RUNNER_ID}"
          if echo "${RUNNER_ID}" | grep -qiE 'uid=0\(root\)'; then
            echo "✗ process runs as root at runtime"
            exit 1
          fi
          echo "✓ process is non-root at runtime"

          # The runtime user must be able to WRITE /data (DB init at startup).
          if docker run --rm --entrypoint sh "${IMAGE_REF}" -c \
              'touch /data/.write-probe && rm -f /data/.write-probe && test -w /data'; then
            echo "✓ /data is writable by the runtime user"
          else
            echo "✗ /data is not writable by the runtime user"
            exit 1
          fi

      - name: Verify image build identity metadata
        run: |
          echo "Checking image builds from exactly this commit..."
          IMAGE_REF="${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}"
          GIT_IN_IMAGE=$(docker inspect "${IMAGE_REF}" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep '^NEWSFORGE_GIT_COMMIT=' || true)
          echo "Image NEWSFORGE_GIT_COMMIT: '${GIT_IN_IMAGE}'"
          if [ -z "${GIT_IN_IMAGE}" ]; then
            echo "✗ image has no NEWSFORGE_GIT_COMMIT metadata"
            exit 1
          fi
          GIT_VALUE=$(echo "${GIT_IN_IMAGE}" | sed 's/^NEWSFORGE_GIT_COMMIT=//')
          if [ "${GIT_VALUE}" = "${{ github.sha }}" ]; then
            echo "✓ image identity matches ${{ github.sha }}"
          else
            echo "✗ expected ${{ github.sha }}, image reports '${GIT_VALUE}'"
            exit 1
          fi

          # Runtime image must NOT ship test-only tools, and no .env is baked in.
          if docker run --rm --entrypoint sh "${IMAGE_REF}" -c 'test ! -e /app/.env'; then
            echo "✓ no .env file baked into the image"
          else
            echo "✗ found a .env file in the image"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          # Cleanup any running containers from health, smoke and persistence tests
          docker rm -f newsforge-health-test-* 2>/dev/null || true
          docker rm -f newsforge-smoke-test-* 2>/dev/null || true
          docker rm -f newsforge-persistence-* 2>/dev/null || true
          docker volume rm -f newsforge-persist-vol 2>/dev/null || true
          echo "Cleanup complete"
